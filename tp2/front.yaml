apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  replicas: 3
  selector:
    matchLabels:
      fr.orsys/app: front
      fr.orsys/env: staging
  template:
    metadata:
      labels:
        fr.orsys/app: front
        fr.orsys/env: staging
    spec:
      
      containers:
      - name: java
        image: dumontcyril/gc-web:1.0
        env: 
        - name: APP_SERVICES_CLIENTS_URL
          value: http://api
        - name: SERVER_PORT
          value: "8080"
        ports:
        - containerPort: 8080
--- 
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  selector:
    fr.orsys/app: front
    fr.orsys/env: staging
  ports:
  - port: 80
    targetPort: 8080

--- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gc
spec:
  ingressClassName: nginx
  rules:
  - host: training-k8s.staging.tech.ouidou.fr # tp.k8s.fr
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: front
            port: 
              number: 80
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: api
            port: 
              number: 80


