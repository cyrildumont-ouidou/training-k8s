apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      fr.orsys/app: bdd
      fr.orsys/env: staging
  template:
    metadata:
      labels:
        fr.orsys/app: bdd
        fr.orsys/env: staging
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
      containers:
      - name: postgres
        image: postgres:17
        readinessProbe:
          initialDelaySeconds: 5
          exec:
            command: 
               - sh 
               - -c  
               - 'pg_isready -d $POSTGRES_DB -U $POSTGRES_USER'
        volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: data
        env:
          - name: POSTGRES_USER
            value: user
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                key: schema
                name: bdd-config
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: db-secret
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    fr.orsys/app: bdd
    fr.orsys/env: staging
  ports:
  - port: 5432
    targetPort: 5432
